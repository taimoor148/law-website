  <!-- Cross divider -->
  <line x1="200" y1="74" x2="200" y2="276" stroke="url(#s-gold)" stroke-width="2.4" opacity="0.7"/>
  <line x1="120" y1="164" x2="280" y2="164" stroke="url(#s-gold)" stroke-width="2.4" opacity="0.7"/>

  <!-- Top quadrants: scales left, gavel right -->
  <g transform="translate(146 128) scale(0.9)" fill="none" stroke="#E5C76E" opacity="0.95">
    <line x1="26" y1="10" x2="26" y2="30" stroke-width="2.4"/>
