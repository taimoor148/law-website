<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="c-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4E3A6"/>
      <stop offset="0.5" stop-color="#D9B24C"/>
      <stop offset="1" stop-color="#8A6526"/>
    </linearGradient>
    <linearGradient id="c-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9B24C" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#D9B24C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="c-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F4E3A6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#D9B24C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky glow -->
  <rect x="60" y="30" width="280" height="190" fill="url(#c-sky)"/>
  <circle cx="200" cy="96" r="56" fill="url(#c-sun)"/>

  <!-- Pediment triangle -->
  <path d="M120 118 L200 62 L280 118 Z" fill="#14120E" stroke="url(#c-gold)" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M200 84 L178 110 H222 Z" fill="none" stroke="url(#c-gold)" stroke-width="2.5" opacity="0.7"/>

  <!-- Frieze row of columns -->
  <rect x="130" y="118" width="140" height="10" fill="url(#c-gold)"/>

  <!-- Columns -->
  <g stroke="url(#c-gold)" stroke-width="3" fill="none">
    <rect x="138" y="128" width="18" height="120" rx="3"/>
    <rect x="164" y="128" width="18" height="120" rx="3"/>
    <rect x="190" y="128" width="18" height="120" rx="3"/>
    <rect x="216" y="128" width="18" height="120" rx="3"/>
    <rect x="242" y="128" width="18" height="120" rx="3"/>
  </g>
  <line x1="132" y1="128" x2="270" y2="128" stroke="url(#c-gold)" stroke-width="4"/>
  <line x1="132" y1="250" x2="270" y2="250" stroke="url(#c-gold)" stroke-width="4"/>

  <!-- Columns internal fill -->
  <g fill="#1A1712" opacity="0.6">
    <rect x="140" y="130" width="14" height="118"/>
    <rect x="166" y="130" width="14" height="118"/>
    <rect x="192" y="130" width="14" height="118"/>
    <rect x="218" y="130" width="14" height="118"/>
    <rect x="244" y="130" width="14" height="118"/>
  </g>

  <!-- Door -->
  <path d="M182 250 V206 Q200 194 218 206 V250 Z" fill="url(#c-gold)" opacity="0.55"/>
  <path d="M196 250 V210 M204 250 V210" stroke="#241C07" stroke-width="1.4" opacity="0.4"/>

  <!-- Base steps -->
  <rect x="112" y="252" width="176" height="14" rx="3" fill="url(#c-gold)" opacity="0.85"/>
  <rect x="98" y="266" width="204" height="14" rx="3" fill="url(#c-gold)" opacity="0.6"/>
  <rect x="84" y="280" width="232" height="14" rx="3" fill="url(#c-gold)" opacity="0.4"/>
</svg>
