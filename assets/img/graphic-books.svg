    <path d="M200 286 Q150 278 120 258 Q104 248 104 234 V96 Q104 110 122 122 Q150 138 200 146 Z" fill="none" stroke="url(#b-gold)" stroke-width="3"/>
    <path d="M200 286 Q150 278 120 258 Q104 248 104 234 V96 Q104 110 122 122 Q150 138 200 146 Z" fill="#1A1712" opacity="0.55"/>
    <!-- Right page -->
    <path d="M200 286 Q250 278 280 258 Q296 248 296 234 V96 Q296 110 278 122 Q250 138 200 146 Z" fill="none" stroke="url(#b-gold)" stroke-width="3"/>
    <path d="M200 286 Q250 278 280 258 Q296 248 296 234 V96 Q296 110 278 122 Q250 138 200 146 Z" fill="#1A1712" opacity="0.55"/>
    <!-- Text lines left -->
    <g stroke="#E5C76E" stroke-width="2.2" stroke-linecap="round" opacity="0.5">
      <path d="M126 140 Q150 152 192 160"/>
      <path d="M124 158 Q148 170 190 177"/>
      <path d="M122 176 Q146 188 188 195"/>
      <path d="M120 194 Q144 206 186 212"/>
    </g>
    <!-- Text lines right -->
    <g stroke="#E5C76E" stroke-width="2.2" stroke-linecap="round" opacity="0.5">
      <path d="M274 140 Q250 152 208 160"/>
      <path d="M276 158 Q252 170 210 177"/>
      <path d="M278 176 Q254 188 212 195"/>
      <path d="M280 194 Q256 206 214 212"/>
    </g>
    <!-- Center crease -->
    <line x1="200" y1="146" x2="200" y2="286" stroke="url(#b-gold)" stroke-width="3"/>
    <!-- Scales emblem on cover -->
    <g transform="translate(178 116) scale(0.7)" fill="none" stroke="#F4E3A6" opacity="0.8">
      <circle cx="32" cy="32" r="26" stroke-width="2"/>
      <line x1="32" y1="14" x2="32" y2="40" stroke-width="2.4"/>
      <line x1="14" y1="20" x2="50" y2="20" stroke-width="2.4"/>
      <path d="M15 20 L13 28 M49 20 L51 28" stroke-width="1.8"/>
      <path d="M10 28 H20 M44 28 H54" stroke-width="2"/>
    </g>
  </g>

  <!-- Sparkles -->
  <circle cx="120" cy="90" r="3" fill="#F4E3A6" opacity="0.85"/>
  <circle cx="292" cy="76" r="2.4" fill="#E5C76E" opacity="0.7"/>
  <circle cx="336" cy="150" r="2" fill="#F4E3A6" opacity="0.6"/>
