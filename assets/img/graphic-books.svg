<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="b-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4E3A6"/>
      <stop offset="0.5" stop-color="#D9B24C"/>
      <stop offset="1" stop-color="#8A6526"/>
    </linearGradient>
    <radialGradient id="b-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D9B24C" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#D9B24C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b-spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6526"/>
      <stop offset="0.5" stop-color="#E5C76E"/>
      <stop offset="1" stop-color="#8A6526"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="150" r="130" fill="url(#b-glow)"/>
  <ellipse cx="200" cy="286" rx="130" ry="13" fill="#0D0C0A" opacity="0.4"/>

  <!-- Standing open book -->
  <g>
