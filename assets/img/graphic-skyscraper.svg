<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="sk-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4E3A6"/>
      <stop offset="0.5" stop-color="#D9B24C"/>
      <stop offset="1" stop-color="#8A6526"/>
    </linearGradient>
    <radialGradient id="sk-glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#D9B24C" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#D9B24C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="200" cy="150" r="135" fill="url(#sk-glow)"/>

  <!-- Building -->
  <g>
    <rect x="96" y="64" width="208" height="216" rx="4" fill="#15130F" stroke="url(#sk-gold)" stroke-width="3.5"/>
    <!-- Vertical lines -->
    <g stroke="url(#sk-gold)" stroke-width="1.6" opacity="0.55">
      <line x1="150" y1="64" x2="150" y2="280"/>
      <line x1="200" y1="64" x2="200" y2="280"/>
      <line x1="250" y1="64" x2="250" y2="280"/>
    </g>
    <!-- Floors -->
    <g stroke="url(#sk-gold)" stroke-width="1.3" opacity="0.45">
      <line x1="96" y1="92" x2="304" y2="92"/>
      <line x1="96" y1="120" x2="304" y2="120"/>
      <line x1="96" y1="148" x2="304" y2="148"/>
      <line x1="96" y1="176" x2="304" y2="176"/>
      <line x1="96" y1="204" x2="304" y2="204"/>
      <line x1="96" y1="232" x2="304" y2="232"/>
      <line x1="96" y1="260" x2="304" y2="260"/>
    </g>
    <!-- Lit windows (gold) -->
    <g fill="#E5C76E" opacity="0.85">
      <rect x="106" y="70" width="16" height="14" rx="2"/>
      <rect x="160" y="70" width="16" height="14" rx="2"/>
      <rect x="260" y="70" width="16" height="14" rx="2"/>
      <rect x="106" y="98" width="16" height="14" rx="2"/>
      <rect x="210" y="98" width="16" height="14" rx="2"/>
      <rect x="156" y="126" width="16" height="14" rx="2"/>
      <rect x="260" y="126" width="16" height="14" rx="2"/>
      <rect x="206" y="154" width="16" height="14" rx="2"/>
      <rect x="106" y="182" width="16" height="14" rx="2"/>
      <rect x="258" y="182" width="16" height="14" rx="2"/>
      <rect x="158" y="210" width="16" height="14" rx="2"/>
      <rect x="210" y="238" width="16" height="14" rx="2"/>
    </g>
    <!-- Dim windows -->
    <g fill="#3A352C" opacity="0.6">
      <rect x="160" y="98" width="16" height="14" rx="2"/>
      <rect x="260" y="98" width="16" height="14" rx="2"/>
      <rect x="106" y="126" width="16" height="14" rx="2"/>
      <rect x="206" y="126" width="16" height="14" rx="2"/>
      <rect x="156" y="154" width="16" height="14" rx="2"/>
      <rect x="256" y="210" width="16" height="14" rx="2"/>
      <rect x="106" y="238" width="16" height="14" rx="2"/>
      <rect x="158" y="238" width="16" height="14" rx="2"/>
      <rect x="258" y="238" width="16" height="14" rx="2"/>
    </g>
    <!-- Antenna -->
    <line x1="200" y1="64" x2="200" y2="46" stroke="url(#sk-gold)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="200" cy="42" r="4" fill="#E5C76E"/>
  </g>

  <!-- Side sparkles -->
  <circle cx="72" cy="96" r="3" fill="#F4E3A6" opacity="0.8"/>
  <circle cx="334" cy="120" r="2.4" fill="#E5C76E" opacity="0.7"/>
  <circle cx="64" cy="220" r="2" fill="#F4E3A6" opacity="0.6"/>
</svg>
