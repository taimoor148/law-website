<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="ct-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4E3A6"/>
      <stop offset="0.5" stop-color="#D9B24C"/>
      <stop offset="1" stop-color="#8A6526"/>
    </linearGradient>
    <radialGradient id="ct-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D9B24C" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#D9B24C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ct-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2620"/>
      <stop offset="1" stop-color="#1C1A15"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="150" r="130" fill="url(#ct-glow)"/>

  <!-- Scroll / document -->
  <g transform="translate(200 0) rotate(-4) translate(-200 0)">
    <!-- Rolled top -->
    <ellipse cx="200" cy="78" rx="96" ry="14" fill="url(#ct-gold)"/>
    <path d="M104 78 V236 Q104 258 200 258 Q296 258 296 236 V78" fill="url(#ct-paper)"/>
    <path d="M104 78 V236 Q104 258 200 258 Q296 258 296 236 V78" fill="none" stroke="url(#ct-gold)" stroke-width="3"/>
    <!-- Rolled bottom -->
    <ellipse cx="200" cy="246" rx="96" ry="13" fill="url(#ct-gold)"/>

    <!-- Text lines -->
    <g stroke="#E5C76E" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <path d="M140 106 H260"/>
      <path d="M140 124 H244"/>
      <path d="M140 142 H266"/>
      <path d="M140 160 H238"/>
      <path d="M140 178 H252"/>
      <path d="M140 196 H232"/>
    </g>
    <!-- Signature line -->
    <path d="M150 226 H210" stroke="#E5C76E" stroke-width="2" opacity="0.6"/>
    <!-- Seal -->
    <circle cx="258" cy="222" r="16" fill="none" stroke="#D9B24C" stroke-width="2.4" opacity="0.9"/>
    <polygon points="258,214 265,228 251,228" fill="#D9B24C" opacity="0.8" transform="rotate(180 258 222)"/>
  </g>

  <!-- Fountain pen -->
  <g transform="translate(330 52) rotate(38)">
    <path d="M0 0 L-8 -22 L8 -22 Z" fill="url(#ct-gold)"/>
    <path d="M-8 -22 H8 L6 -34 Q0 -40 -6 -34 Z" fill="#3A352C" stroke="url(#ct-gold)" stroke-width="1.4"/>
    <rect x="-3" y="-26" width="6" height="10" rx="1" fill="#241C07" opacity="0.6"/>
  </g>

  <!-- Sparkles -->
  <circle cx="96" cy="120" r="3" fill="#F4E3A6" opacity="0.8"/>
  <circle cx="120" cy="86" r="2" fill="#E5C76E" opacity="0.6"/>
</svg>
